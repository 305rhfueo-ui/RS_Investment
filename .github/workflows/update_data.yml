name: Update RS Data

on:
  schedule:
    # 매일 21:50 UTC = 한국 시간 06:50 시작 → 정상이면 07:15 전후로 사이트 갱신.
    # 정각(:00)은 깃허브 스케줄 큐가 가장 붐벼 지연이 크므로 일부러 비켜 둔다.
    # 서머타임 종료 후(EST) 미국 장 마감이 21:00 UTC 라 50분 여유를 둔 시각이다.
    - cron: '50 21 * * *'
  workflow_dispatch: # 수동 실행 가능

# 야후 수집 작업끼리 겹치지 않게 직렬화한다.
# 2026-09-15 사고: daily_scan.yml 이 같은 fetch_and_save.py 를 중복 실행했고
# 깃허브가 스케줄을 2시간 반 밀면서 두 런이 겹쳤다. 뒤 런이 429 를 16회 맞아
# 수집이 21분 -> 99분으로 늘고 결측률이 17.3% -> 68.1% 로 치솟아 발행이 보류됐다.
# update_fs_data.yml 도 같은 그룹이라 서로 기다린다(취소하지 않고 대기).
concurrency:
  group: rs-investment-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write # 저장소 쓰기 권한 필요

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install yfinance pandas requests openpyxl oauth2client gspread

    - name: Create Service Account JSON
      env:
        SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
      run: echo "$SERVICE_ACCOUNT_JSON" > service_account.json

    - name: Run script
      run: python fetch_and_save.py

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        # 변경사항이 있을 때만 커밋
        git commit -m "Auto-update: $(date +'%Y-%m-%d')" || echo "No changes to commit"
        # ⚠️ 순서 주의: 커밋을 먼저 하고 rebase 한다.
        #    작업 트리가 더러운 상태에서 pull --rebase 하면 git 이 거부한다.
        #    커밋 뒤 rebase 해야 다른 워크플로가 먼저 push 해도 충돌 없이 얹힌다
        #    (2026-09-15: 이 단계가 없어 'fetch first' 로 런 전체가 실패했다).
        git pull --rebase
        git push
